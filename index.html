<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💕</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #ffd6e8; /* baby pink */
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Comic Sans MS', cursive;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: #fff0f6;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 420px;
      z-index: 2;
      position: relative;
    }

    h1 {
      color: #ff5fa2;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      font-size: 18px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      background-color: #ff8fc7;
      color: white;
    }

    button:hover {
      background-color: #ff5fa2;
    }

    img {
      width: 160px;
      margin-top: 15px;
    }

    .hibiscus {
      position: absolute;
      font-size: 42px;
    }
    .top-left { top: 10px; left: 10px; }
    .top-right { top: 10px; right: 10px; }
    .bottom-left { bottom: 10px; left: 10px; }
    .bottom-right { bottom: 10px; right: 10px; }

    .heart {
      position: absolute;
      top: -10px;
      color: #ff5fa2;
      font-size: 20px;
      animation: fall linear infinite;
      z-index: 1;
    }

    @keyframes fall {
      from { transform: translateY(-10vh); opacity: 1; }
      to { transform: translateY(110vh); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Hibiscus flowers -->
  <div class="hibiscus top-left">🌺</div>
  <div class="hibiscus top-right">🌺</div>
  <div class="hibiscus bottom-left">🌺</div>
  <div class="hibiscus bottom-right">🌺</div>

  <div class="card" id="card">
    <h1>Jolene 💕</h1>
    <p>Will you be my Valentine?</p>

    <button onclick="yesClicked()">Yes 💖</button>
    <button id="noBtn" onmouseover="runNo()">No 💔</button>

    <br>
    <img src="https://upload.wikimedia.org/wikipedia/en/5/53/Snoopy_Peanuts.png" alt="Snoopy">
  </div>

  <script>
    function yesClicked() {
      document.getElementById("card").innerHTML = `
        <h1>YAYYY 💞</h1>
        <p>I love you ❤️</p>
        <img src="https://upload.wikimedia.org/wikipedia/en/5/53/Snoopy_Peanuts.png" alt="Snoopy">
      `;
      createExplosionHearts();
      enableCursorHearts();
    }

    function runNo() {
      alert("Oh wow… I see how it is 😔💔");
      const noBtn = document.getElementById('noBtn');
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '💗';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
      document.body.appendChild(heart);
      setTimeout(() => { heart.remove(); }, 6000);
    }

    setInterval(createHeart, 300);

    function createExplosionHearts() {
      for (let i = 0; i < 100; i++) {
        const heart = document.createElement('div');
        heart.innerHTML = '💖';
        heart.style.position = 'fixed';
        heart.style.left = window.innerWidth/2 + 'px';
        heart.style.top = window.innerHeight/2 + 'px';
        heart.style.fontSize = Math.random() * 30 + 20 + 'px';
        heart.style.zIndex = 999;
        document.body.appendChild(heart);

        const angle = Math.random() * 2 * Math.PI;
        const distance = Math.random() * 300 + 100;
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        heart.animate([
          { transform: 'translate(0,0)', opacity: 1 },
          { transform: `translate(${x}px, ${y}px)`, opacity: 0 }
        ], { duration: 1500 + Math.random()*1000, easing: 'ease-out' });

        setTimeout(() => heart.remove(), 2500);
      }
    }

    // Hearts follow cursor after Yes click
    function enableCursorHearts() {
      document.addEventListener('mousemove', function(e) {
        const heart = document.createElement('div');
        heart.innerHTML = '💗';
        heart.style.position = 'fixed';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        heart.style.fontSize = Math.random() * 20 + 10 + 'px';
        heart.style.zIndex = 999;
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1000);
      });
    }
  </script>

</body>
</html>
